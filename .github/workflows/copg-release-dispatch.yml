name: Notify module repos

# Fires the moment you publish a release on AlirezaParsi/COPG, telling the Magisk
# Alt Repo to mirror the new zip. It listens for a repository_dispatch of type "sync-release".
# (KernelSU moved to the pull-based Portal at developers.kernelsu.org — no dispatch needed;
# the old KernelSU-Modules-Repo/COPG mirror is archived and no longer receives releases.)

on:
  release:
    types: [published]
  workflow_dispatch:   # manual re-fire when a sync failed/was missed

jobs:
  dispatch:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo:
          - Magisk-Modules-Alt-Repo/COPG
    steps:
      - name: Trigger ${{ matrix.repo }} sync
        run: |
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.MODULE_DISPATCH_PAT }}" \
            https://api.github.com/repos/${{ matrix.repo }}/dispatches \
            -d '{"event_type":"sync-release"}'
